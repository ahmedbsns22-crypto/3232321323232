<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#190713">
  <title>💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-mood="dark">

  <!-- Background: five mood layers cross-fade -->
  <div class="bg" aria-hidden="true">
    <div class="bg-layer" data-l="dark"></div>
    <div class="bg-layer" data-l="rose"></div>
    <div class="bg-layer" data-l="bright"></div>
    <div class="bg-layer" data-l="glow"></div>
    <div class="bg-layer" data-l="deep"></div>
  </div>

  <div class="twinkles" id="twinkles" aria-hidden="true"></div>
  <div class="ambient" id="ambient" aria-hidden="true"></div>
  <div class="beat-glow" aria-hidden="true"></div>

  <!-- All scenes are generated by script.js from CONFIG -->
  <main id="stage"></main>

  <div class="hud" id="hud" aria-hidden="true">
    <span class="hud-name" id="hudName"></span>
    <span class="hud-prog" id="hudProg"></span>
  </div>

  <div class="fx" id="fx" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <noscript>
    <p style="position:fixed;inset:0;display:grid;place-items:center;color:#FFF7FB;font:700 1.4rem sans-serif;text-align:center;padding:2rem">
      فعّلي JavaScript حتى تفتحين الهدية 💗
    </p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
